article5:
  clause_1a:
    legal_text: >
      The placing on the market, the putting into service, or the use of an AI
      system that deploys subliminal techniques beyond a person's consciousness
      or purposefully manipulative or deceptive techniques, with the objective
      or the effect of materially distorting the behaviour of a person or a group
      of persons by appreciably impairing their ability to make an informed decision.
    simplified: "Social scoring by public authorities is prohibited."
    rules:
      - file: article5.lp
        predicate: "prohibited(M, art5_1a, ...)"
        line_range: [20, 23]
    test_cases:
      - test_article5.py::test_social_scoring_prohibited
      - test_article5.py::test_non_social_scoring_not_prohibited
    coverage: complete

  clause_1b:
    legal_text: >
      AI systems that exploit any of the vulnerabilities of a natural person or a
      specific group of persons due to their age, disability or a specific social
      or economic situation, with the objective or the effect of materially distorting
      the behaviour of that person or a person belonging to that group.
    simplified: "Cognitive manipulation / exploitation of vulnerabilities is prohibited."
    rules:
      - file: article5.lp
        predicate: "prohibited(M, art5_1b, ...)"
        line_range: [25, 30]
    test_cases:
      - test_article5.py::test_cognitive_manipulation_prohibited
    coverage: complete

  clause_1c:
    legal_text: >
      The use of real-time remote biometric identification systems in publicly
      accessible spaces for the purposes of law enforcement.
    simplified: "Real-time biometric surveillance for law enforcement is prohibited."
    rules:
      - file: article5.lp
        predicate: "prohibited(M, art5_1c, ...)"
        line_range: [32, 36]
    test_cases:
      - test_article5.py::test_biometric_surveillance_prohibited
    coverage: complete

  clause_1d:
    coverage: not_encoded
    reason: "Requires facial image provenance data not in current model schema"

  clause_1e:
    coverage: not_encoded
    reason: "Requires deployment context (workplace vs education) not in current model schema"

  clause_1f:
    coverage: not_encoded
    reason: "Requires biometric categorization capability detail not in current model schema"

  clause_1g:
    coverage: not_encoded
    reason: "Requires law enforcement deployment context not in current model schema"

  clause_1h:
    coverage: not_encoded
    reason: "Requires predictive policing profiling detail not in current model schema"

article6:
  clause_1:
    simplified: "Models with risk_category=high_risk require high-risk compliance."
    rules:
      - file: article6.lp
        predicate: "requires_high_risk_compliance(M, art6_1)"
    test_cases:
      - test_article6.py::test_high_risk_category_classified
      - test_article6.py::test_non_high_risk_not_classified
    coverage: complete

  clause_2:
    simplified: "Safety-critical use cases (healthcare, law enforcement, etc.) are high-risk."
    rules:
      - file: article6.lp
        predicate: "requires_high_risk_compliance(M, art6_2)"
    test_cases:
      - test_article6.py::test_healthcare_is_high_risk
      - test_article6.py::test_law_enforcement_is_high_risk
