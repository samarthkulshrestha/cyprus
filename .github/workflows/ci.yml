name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gringo

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check cyprus/ tests/

      - name: Type check
        run: mypy cyprus/

      - name: Run tests
        run: pytest --cov=cyprus --cov-report=term-missing -v

      - name: Run policy validation
        run: cyprus policy validate eu_ai_act
